<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/news.css">
  <script async data-domain="news.icodeq.com" src="https://vercel.site.icodeq.com/js/script.js"></script>
  <script defer src="/index.js"></script>
  <title>每日早报</title>
</head>
<body class="typora-export os-windows">
  <div class="typora-export-content">
    <main id="write">
      <h1 style="text-align: center;">每日早报</h1>
      <a id="bing-link" target="_blank" rel="noopener" hidden>
        <img id="bing" alt="必应每日壁纸">
      </a>
      <blockquote style="text-align: center;">
        <div id="date" role="status">正在加载早报…</div>
        <button id="retry" type="button" hidden>重试</button>
        <noscript>请启用 JavaScript 以加载早报。</noscript>
      </blockquote>
      <ol id="news"></ol>
      <blockquote id="quote" style="text-align: center;" hidden>
        <em id="weiyu"></em>
      </blockquote>
      <figure>
        <table>
          <thead>
            <tr>
              <th><button class="button" id="older" type="button"><span class="text">前一天</span></button></th>
              <th><button class="button" id="source" type="button"><span class="text">切换新闻源</span></button></th>
              <th><button class="button" id="newer" type="button" disabled><span class="text">后一天</span></button></th>
            </tr>
          </thead>
        </table>
        <a href="https://github.com/zkeq/news" style="color: #ff1485;">Made with ❤ by zkeq.</a>
        <a href="/dark/">深色模式</a>
      </figure>
    </main>
  </div>
</body>
</html>
